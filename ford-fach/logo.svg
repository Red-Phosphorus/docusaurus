<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <defs>
    <linearGradient id="ovalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055CC"/>
      <stop offset="50%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#001F6B"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60C0FF"/>
      <stop offset="40%" stop-color="#0088EE"/>
      <stop offset="100%" stop-color="#002266"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00AAFF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer chrome rim -->
  <ellipse cx="160" cy="80" rx="152" ry="72" fill="url(#rimGrad)" filter="url(#neonGlow)"/>
  <!-- Main oval body -->
  <ellipse cx="160" cy="80" rx="143" ry="63" fill="url(#ovalGrad)"/>
  <!-- Inner highlight rim -->
  <ellipse cx="160" cy="80" rx="136" ry="56" fill="none" stroke="#4499DD" stroke-width="1.5" opacity="0.6"/>
  <!-- Gloss overlay -->
  <ellipse cx="160" cy="68" rx="110" ry="35" fill="url(#gloss)"/>

  <!-- "Ford" in script style -->
  <text
    x="160" y="75"
    font-family="'Brush Script MT', 'Dancing Script', cursive"
    font-size="46"
    fill="white"
    text-anchor="middle"
    filter="url(#textGlow)"
    letter-spacing="-1"
    style="font-style: italic;"
  >Ford</text>

  <!-- "Fach" in modern display font -->
  <text
    x="160" y="112"
    font-family="'Rajdhani', 'Impact', 'Arial Black', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#FFD700"
    text-anchor="middle"
    filter="url(#goldGlow)"
    letter-spacing="6"
  >FACH</text>

  <!-- Decorative lines -->
  <line x1="40" y1="93" x2="110" y2="93" stroke="#4488CC" stroke-width="0.8" opacity="0.5"/>
  <line x1="210" y1="93" x2="280" y2="93" stroke="#4488CC" stroke-width="0.8" opacity="0.5"/>

  <!-- Star dots -->
  <circle cx="40" cy="93" r="2" fill="#00D4FF" opacity="0.7"/>
  <circle cx="280" cy="93" r="2" fill="#00D4FF" opacity="0.7"/>
</svg>
